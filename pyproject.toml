[build-system]
requires = [
    "scikit-build-core>=0.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "pymdp"
version = "0.1.0"
dependencies = [
    "numpy>=1.17.4",
    "xgboost>=1.0.2"
]
description = "A python package for multi-directional printing decomposition"
readme = "README.rst"
authors = [
    { name = "Chenming Wu", email = "wcm1994@gmail.com" },
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
]
license = "MIT"
license-files = [
    "LICENSE"
]

[project.urls]
Homepage = "https://github.com/chenming-wu/pymdp"
